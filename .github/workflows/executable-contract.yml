name: executable-contract

on:
  push:
    branches: ["contract/spec-pilot"]
  pull_request:
    branches: ["dev"]

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install contract dependencies
        run: python -m pip install -r requirements-contract.txt
      - name: Compile check
        run: python scripts/spec_compile.py --check
      - name: Contract app route check
        run: python scripts/validate_arch.py --app contract_app:app --json
      - name: Contract tests
        run: python -m unittest tests.test_spec_contract
